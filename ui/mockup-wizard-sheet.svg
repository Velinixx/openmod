<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2056" height="1018" viewBox="0 0 2056 1018"><rect width="2056" height="1018" fill="#15181E"/><text x="40" y="54" fill="#ECEFF4" font-size="21" font-family="Cantarell, DejaVu Sans, sans-serif" font-weight="700">openmod · first launch</text><text x="40" y="78" fill="#6E7A8A" font-size="11.5" font-family="Cantarell, DejaVu Sans, sans-serif">five calm steps — the only platform-specific one is the virtual mic (a driver on Windows, free on Linux)</text><rect x="39" y="109" width="642" height="402" rx="8" fill="none" stroke="#2A2F38"/><image x="40" y="110" width="640" height="400" href="mockup-wizard-1-welcome.png" preserveAspectRatio="none"/><text x="40" y="530" fill="#8A94A3" font-size="10.5" letter-spacing="0.4" font-family="Cantarell, DejaVu Sans, sans-serif" font-weight="600">1 · welcome</text><rect x="707" y="109" width="642" height="402" rx="8" fill="none" stroke="#2A2F38"/><image x="708" y="110" width="640" height="400" href="mockup-wizard-2-appearance.png" preserveAspectRatio="none"/><text x="708" y="530" fill="#8A94A3" font-size="10.5" letter-spacing="0.4" font-family="Cantarell, DejaVu Sans, sans-serif" font-weight="600">2 · appearance (dark)</text><rect x="1375" y="109" width="642" height="402" rx="8" fill="none" stroke="#2A2F38"/><image x="1376" y="110" width="640" height="400" href="mockup-wizard-3-vmic-windows.png" preserveAspectRatio="none"/><text x="1376" y="530" fill="#8A94A3" font-size="10.5" letter-spacing="0.4" font-family="Cantarell, DejaVu Sans, sans-serif" font-weight="600">3 · virtual mic — windows (one-press install)</text><rect x="39" y="553" width="642" height="402" rx="8" fill="none" stroke="#2A2F38"/><image x="40" y="554" width="640" height="400" href="mockup-wizard-3-vmic-linux.png" preserveAspectRatio="none"/><text x="40" y="974" fill="#8A94A3" font-size="10.5" letter-spacing="0.4" font-family="Cantarell, DejaVu Sans, sans-serif" font-weight="600">3 · v